const instrumentPanel = document.getElementById('instrument-panel');
const instrumentPanelInner = document.getElementById('instrument-panel-inner');

function renderInstrument(instrumentId) {
  instrumentPanelInner.innerHTML = '';
  if (instrumentId === 'drums') {
    renderDrums();
  } else {
    renderPiano(instrumentId);
  }
}

function renderPiano(instrumentId) {
  // 5 octaves: C2–B6
  const START_OCTAVE = 2;
  const NUM_OCTAVES  = 5;
  const WHITE_W      = 44;
  const BLACK_W      = 28;
  const NOTE_NAMES   = ['C','D','E','F','G','A','B'];
  // semitone offsets of black keys within an octave (after C,D,E,F,G,A,B)
  // black key positions as fraction of white key width from left edge of white key
  const BLACK_AFTER  = [0,1,3,4,5]; // indices of white keys that have a black key to their right (C D F G A)

  const container = document.createElement('div');
  container.id = 'piano-container';

  const keys = document.createElement('div');
  keys.id = 'piano-keys';

  const panelH = instrumentPanelInner.offsetHeight || 200;
  const blackH = Math.round(panelH * 0.62);

  let whiteIndex = 0;

  for (let oct = START_OCTAVE; oct < START_OCTAVE + NUM_OCTAVES; oct++) {
    for (let w = 0; w < 7; w++) {
      const noteName = NOTE_NAMES[w] + oct;

      // White key
      const white = document.createElement('div');
      white.className = 'piano-white';
      white.dataset.note = noteName;
      const label = document.createElement('div');
      label.className = 'piano-white-label';
      if (w === 0) label.textContent = 'C' + oct;
      white.appendChild(label);

      white.addEventListener('pointerdown', e => {
        e.preventDefault();
        white.classList.add('pressed');
        playNote(noteName, instrumentId);
      });
      white.addEventListener('pointerup',    () => white.classList.remove('pressed'));
      white.addEventListener('pointerleave', () => white.classList.remove('pressed'));

      keys.appendChild(white);

      // Black key to the right of this white key?
      if (BLACK_AFTER.includes(w)) {
        const black = document.createElement('div');
        black.className = 'piano-black';
        black.style.height = blackH + 'px';
        black.style.left = (whiteIndex * WHITE_W + WHITE_W - BLACK_W / 2 + 16) + 'px'; // +16 for padding
        const blackNote = NOTE_NAMES[w] + '#' + oct;
        black.dataset.note = blackNote;

        black.addEventListener('pointerdown', e => {
          e.preventDefault();
          black.classList.add('pressed');
          playNote(blackNote, instrumentId);
        });
        black.addEventListener('pointerup',    () => black.classList.remove('pressed'));
        black.addEventListener('pointerleave', () => black.classList.remove('pressed'));

        keys.appendChild(black);
      }

      whiteIndex++;
    }
  }

  // Total width
  const totalWhites = NUM_OCTAVES * 7;
  keys.style.width = (totalWhites * WHITE_W + 32) + 'px'; // +32 for padding

  container.appendChild(keys);
  instrumentPanelInner.appendChild(container);

  // Scroll so C4 is centered
  // C4 is the start of octave 4, white key index = (4 - START_OCTAVE) * 7 = 14
  const c4WhiteIndex = (4 - START_OCTAVE) * 7;
  const c4Left = c4WhiteIndex * WHITE_W + 16; // +16 for padding
  const scrollTo = c4Left - (container.offsetWidth / 2) + (WHITE_W / 2);
  container.scrollLeft = scrollTo;
}

function renderDrums() {
  const PADS = [
    { id: 'kick',      label: 'Kick',    icon: '🔵', color: '#1a3a5c' },
    { id: 'snare',     label: 'Snare',   icon: '⚪', color: '#3a2a1a' },
    { id: 'hihat_c',   label: 'Hi-Hat',  icon: '🟡', color: '#2a2a10' },
    { id: 'hihat_o',   label: 'Open HH', icon: '🟠', color: '#2a1a08' },
    { id: 'crash',     label: 'Crash',   icon: '💥', color: '#2a1a2a' },
    { id: 'ride',      label: 'Ride',    icon: '✨', color: '#1a2a2a' },
    { id: 'tom_hi',    label: 'Hi Tom',  icon: '🔴', color: '#2a1010' },
    { id: 'tom_mid',   label: 'Mid Tom', icon: '🟤', color: '#1e1408' },
    { id: 'tom_floor', label: 'Floor',   icon: '🟣', color: '#1a1028' },
    { id: 'rimshot',   label: 'Rim',     icon: '⭕', color: '#0e2010' },
    { id: 'clap',      label: 'Clap',    icon: '👏', color: '#281818' },
    { id: 'cowbell',   label: 'Cowbell', icon: '🔔', color: '#1c1c08' },
  ];

  const grid = document.createElement('div');
  grid.id = 'drum-grid';

  PADS.forEach(pad => {
    const el = document.createElement('div');
    el.className = 'drum-pad';
    el.style.background = pad.color;
    el.style.borderColor = shiftColor(pad.color, 40);
    el.innerHTML = `<div class="drum-pad-icon">${pad.icon}</div><div class="drum-pad-label">${pad.label}</div>`;

    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      el.classList.add('pressed');
      playDrum(pad.id);
    });
    el.addEventListener('pointerup',    () => el.classList.remove('pressed'));
    el.addEventListener('pointerleave', () => el.classList.remove('pressed'));

    grid.appendChild(el);
  });

  instrumentPanelInner.appendChild(grid);
}

function shiftColor(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 0xff) + amount);
  const g = Math.min(255, ((n >>  8) & 0xff) + amount);
  const b = Math.min(255,  (n        & 0xff) + amount);
  return `rgb(${r},${g},${b})`;
}

function playDrum(id) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  if (id === 'kick') {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
    gain.gain.setValueAtTime(1.0, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.4);

  } else if (id === 'snare') {
    // Tone component
    const osc = ctx.createOscillator();
    const oscGain = ctx.createGain();
    osc.frequency.value = 200;
    oscGain.gain.setValueAtTime(0.7, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(oscGain); oscGain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.15);
    // Noise component
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 1000;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.8, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.2);

  } else if (id === 'hihat_c') {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    noise.connect(f); f.connect(g); g.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.05);

  } else if (id === 'hihat_o') {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.35, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    noise.connect(f); f.connect(g); g.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.35);

  } else if (id === 'crash') {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.6, now); g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    noise.connect(f); f.connect(g); g.connect(ctx.destination);
    noise.start(now); noise.stop(now + 1.5);

  } else if (id === 'ride') {
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.4, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    master.connect(ctx.destination);
    const modGain = ctx.createGain(); modGain.gain.value = 800;
    const mod = ctx.createOscillator(); mod.frequency.value = 439;
    const car = ctx.createOscillator(); car.frequency.value = 550;
    mod.connect(modGain); modGain.connect(car.frequency); car.connect(master);
    mod.start(now); car.start(now); mod.stop(now + 1.0); car.stop(now + 1.0);

  } else if (id === 'tom_hi') {
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.15);
    g.gain.setValueAtTime(0.8, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.25);

  } else if (id === 'tom_mid') {
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
    g.gain.setValueAtTime(0.8, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.3);

  } else if (id === 'tom_floor') {
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
    g.gain.setValueAtTime(0.9, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.4);

  } else if (id === 'rimshot') {
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type = 'square'; osc.frequency.value = 1600;
    g.gain.setValueAtTime(0.4, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.06);

  } else if (id === 'clap') {
    [0, 0.01, 0.02].forEach(offset => {
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource(); noise.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 0.8;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.6, now + offset); g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.15);
      noise.connect(f); f.connect(g); g.connect(ctx.destination);
      noise.start(now + offset); noise.stop(now + offset + 0.15);
    });

  } else if (id === 'cowbell') {
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.5, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    master.connect(ctx.destination);
    [562, 845].forEach(f => {
      const osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.5;
      osc.connect(g); g.connect(master); osc.start(now); osc.stop(now + 0.8);
    });
  }
}

// ── Web Audio ──
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ── Note Data Model ──
// Each note: { note, midi, velocity, start, duration }
//   note     — string e.g. "C#4"
//   midi     — MIDI note number 0–127
//   velocity — 0–127 (defaults to 100 for tap input)
//   start    — position in beats from measure start (0.0 = downbeat)
//   duration — length in beats (e.g. 0.5 = eighth note at any BPM)

function noteToMidi(note) {
  const match = note.match(/^([A-G])(#|b)?(\d+)$/);
  if (!match) return 69; // fallback to A4
  const names = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  let semitone = names[match[1]];
  if (match[2] === '#') semitone++;
  if (match[2] === 'b') semitone--;
  const octave = parseInt(match[3]);
  return (octave + 1) * 12 + semitone;
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function createNote(noteName, start = 0, duration = 0.5, velocity = 100) {
  return {
    note:     noteName,
    midi:     noteToMidi(noteName),
    velocity: Math.max(0, Math.min(127, velocity)),
    start,
    duration,
  };
}

function noteToFreq(note) {
  return midiToFreq(noteToMidi(note));
}

function playNote(note, instrumentId) {
  const ctx  = getAudioCtx();
  const freq = noteToFreq(note);
  const now  = ctx.currentTime;

  if (instrumentId === 'piano') {
    // Piano: two detuned triangle oscillators + fast decay
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.4, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
    master.connect(ctx.destination);

    [-4, 4].forEach(detune => {
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      osc.detune.value = detune;
      const g = ctx.createGain();
      g.gain.setValueAtTime(1, now);
      g.gain.exponentialRampToValueAtTime(0.3, now + 0.1);
      osc.connect(g);
      g.connect(master);
      osc.start(now);
      osc.stop(now + 2.5);
    });

  } else if (instrumentId === 'bass') {
    // Bass: sine + sub octave, punchy
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.6, now + 0.01);
    master.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
    master.connect(ctx.destination);

    [1, 0.5].forEach((mult, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * mult;
      const g = ctx.createGain();
      g.gain.value = i === 0 ? 0.7 : 0.4;
      osc.connect(g);
      g.connect(master);
      osc.start(now);
      osc.stop(now + 1.2);
    });

  } else if (instrumentId === 'lead') {
    // Lead: sawtooth with filter sweep
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.3, now + 0.02);
    master.gain.setValueAtTime(0.3, now + 0.3);
    master.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    master.connect(ctx.destination);

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(freq * 4, now);
    filter.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.3);
    filter.Q.value = 4;
    filter.connect(master);

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    osc.connect(filter);
    osc.start(now);
    osc.stop(now + 1.0);

  } else if (instrumentId === 'pad') {
    // Pad: soft sine cluster, slow attack
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.25, now + 0.4);
    master.gain.setValueAtTime(0.25, now + 1.5);
    master.gain.exponentialRampToValueAtTime(0.001, now + 3.0);
    master.connect(ctx.destination);

    [-7, 0, 7, 12].forEach(detune => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.detune.value = detune;
      osc.connect(master);
      osc.start(now);
      osc.stop(now + 3.0);
    });

  } else if (instrumentId === 'organ') {
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.25, now);
    master.gain.setValueAtTime(0.001, now + 1.2);
    master.connect(ctx.destination);
    [1, 2, 3, 4].forEach((harmonic, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * harmonic;
      const g = ctx.createGain(); g.gain.value = 1 / (i + 1);
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now + 1.2);
    });

  } else if (instrumentId === 'vibraphone') {
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.4, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 3.5);
    master.connect(ctx.destination);
    const modGain = ctx.createGain();
    modGain.gain.setValueAtTime(freq * 2, now);
    modGain.gain.exponentialRampToValueAtTime(freq * 0.1, now + 1.0);
    const modulator = ctx.createOscillator();
    modulator.type = 'sine'; modulator.frequency.value = freq * 2.756;
    const carrier = ctx.createOscillator();
    carrier.type = 'sine'; carrier.frequency.value = freq;
    modulator.connect(modGain); modGain.connect(carrier.frequency);
    carrier.connect(master);
    modulator.start(now); carrier.start(now);
    modulator.stop(now + 3.5); carrier.stop(now + 3.5);

  } else if (instrumentId === 'plucked') {
    const bufSize = Math.round(ctx.sampleRate / freq);
    const buffer  = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data    = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const source = ctx.createBufferSource();
    source.buffer = buffer; source.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = freq * 8;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.5, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
    source.connect(filter); filter.connect(master); master.connect(ctx.destination);
    source.start(now); source.stop(now + 2.5);

  } else if (instrumentId === 'flute') {
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.3, now + 0.08);
    master.gain.setValueAtTime(0.3, now + 0.8);
    master.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
    master.connect(ctx.destination);
    const osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = freq;
    osc.connect(master); osc.start(now); osc.stop(now + 1.8);
    const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuffer.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = freq; noiseFilter.Q.value = 12;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0, now);
    noiseGain.gain.linearRampToValueAtTime(0.04, now + 0.08);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 1.8);

  } else if (instrumentId === 'brass') {
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.4, now + 0.04);
    master.gain.setValueAtTime(0.4, now + 0.5);
    master.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
    master.connect(ctx.destination);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(freq * 1.5, now);
    filter.frequency.exponentialRampToValueAtTime(freq * 6, now + 0.04);
    filter.frequency.exponentialRampToValueAtTime(freq * 2, now + 0.5);
    filter.Q.value = 2.5; filter.connect(master);
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth'; osc.frequency.value = freq;
    osc.connect(filter); osc.start(now); osc.stop(now + 1.4);

  } else if (instrumentId === 'harpsichord') {
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.5, now);
    master.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
    master.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    master.connect(ctx.destination);
    [1, 2, 3].forEach((harmonic, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth'; osc.frequency.value = freq * harmonic;
      const g = ctx.createGain(); g.gain.value = 1 / (i + 1);
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now + 0.8);
    });

  } else {
    // Fallback: simple sine
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    osc.frequency.value = freq;
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 1.0);
  }
}

// ── Measure Zoom ──
let measureZoomed = false;
let lastTapTime = 0, lastTapCell = null;
const ZOOM_DURATION = 750;

let savedPanX, savedScaleX, savedPanY, savedHeaderColW, savedZoomBarH;
let zoomedTrackIndex = -1;
let zoomedMeasureIndex = -1;

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}

function updateCellPositions(row) {
  const mw = MEASURE_W * scaleX;
  row.querySelectorAll('.measure-cell').forEach(cell => {
    const m = +cell.dataset.measure;
    cell.style.left  = (m * mw) + 'px';
    cell.style.width = (mw - 2) + 'px';
  });
}

function updateTrackGridsLight() {
  const sig   = G ? G.timeSig : setup.timeSig;
  const beats = parseInt(sig.split('/')[0]) || 4;
  const mw    = MEASURE_W * scaleX;
  const beatW = mw / beats;
  const mc = 'rgba(255,255,255,0.12)', bc = 'rgba(255,255,255,0.04)';
  const bg = `repeating-linear-gradient(90deg,transparent 0px,transparent ${mw-2}px,${mc} ${mw-2}px,${mc} ${mw}px),repeating-linear-gradient(90deg,transparent 0px,transparent ${beatW-1}px,${bc} ${beatW-1}px,${bc} ${beatW}px)`;
  document.querySelectorAll('.track-row').forEach(r => {
    r.style.backgroundImage = bg;
    r.style.width = (TOTAL_MEASURES * mw) + 'px';
    updateCellPositions(r);
  });
  canvas.style.width = (TOTAL_MEASURES * MEASURE_W * scaleX) + 'px';
}

function animateMeasureZoom(from, to, onDone) {
  if (zoomAnimFrame) cancelAnimationFrame(zoomAnimFrame);
  const headerCol = document.getElementById('track-header-col');
  const zoomBar   = document.getElementById('zoom-bar');
  const trackList = document.getElementById('track-list');
  const rows      = Array.from(document.querySelectorAll('.track-row'));
  const headers   = Array.from(document.querySelectorAll('.track-header'));

  // Disable CSS transitions on things we're manually animating
  headerCol.style.transition = 'none';
  document.querySelectorAll('.track-header').forEach(h => h.style.transition = 'none');

  const start = performance.now();
  function step(now) {
    const raw = Math.min(1, (now - start) / ZOOM_DURATION);
    const t   = easeInOut(raw);

    // Pan & scale
    scaleX = from.scaleX + (to.scaleX - from.scaleX) * t;
    panX   = from.panX   + (to.panX   - from.panX)   * t;
    panY   = from.panY   + (to.panY   - from.panY)   * t;

    // Header col width collapses for layout; content slides left at full width
    const hw = from.headerColW + (to.headerColW - from.headerColW) * t;
    headerCol.style.width = hw + 'px';
    const fullW = from.headerColW || to.headerColW;
    const slideX = -(fullW - hw);
    headerList.style.transform = `translateX(${slideX}px) translateY(${panY}px)`;
    headers.forEach(h => h.style.width = fullW + 'px');

    // Zoom bar — wrapper collapses, bar slides up
    const zh = from.zoomBarH + (to.zoomBarH - from.zoomBarH) * t;
    document.getElementById('zoom-bar-wrap').style.height = zh + 'px';
    zoomBar.style.transform = `translateY(${zh - 28}px)`;

    // Row heights + borders
    rows.forEach((r, i) => {
      const rh = i === zoomedTrackIndex
        ? from.targetRowH + (to.targetRowH - from.targetRowH) * t
        : from.otherRowH  + (to.otherRowH  - from.otherRowH)  * t;
      r.style.height = rh + 'px';
      const bw = i === zoomedTrackIndex
        ? (to.targetRowH < from.targetRowH ? t : 1 - t) // fade out on zoom-in, in on zoom-out
        : from.otherRowH > 0 ? (1 - t) : 0;
      r.style.borderTopWidth    = bw + 'px';
      r.style.borderBottomWidth = bw + 'px';
    });
    trackList.style.gap = (from.gap + (to.gap - from.gap) * t) + 'px';

    // Instrument panel slide
    if (from.panelY !== undefined) {
      const py = from.panelY + (to.panelY - from.panelY) * t;
      instrumentPanel.style.transform = `translateY(${py}%)`;
    }

    // Light grid/canvas update
    updateTrackGridsLight();
    applyTransform();

    if (raw < 1) {
      zoomAnimFrame = requestAnimationFrame(step);
    } else {
      zoomAnimFrame = null;
      if (onDone) onDone();
    }
  }
  zoomAnimFrame = requestAnimationFrame(step);
}

function zoomIntoMeasure(trackIndex, measureIndex) {
  if (measureZoomed || zoomAnimFrame) return;
  measureZoomed    = true;
  zoomedTrackIndex   = trackIndex;
  zoomedMeasureIndex = measureIndex;

  const headerCol = document.getElementById('track-header-col');
  const gameBody  = document.getElementById('game-body');
  const backBtn   = document.getElementById('measure-back-btn');

  const currentHeaderW = drawerOpen ? HEADER_W_OPEN : HEADER_W_CLOSED;
  savedPanX       = panX;
  savedScaleX     = scaleX;
  savedPanY       = panY;
  savedHeaderColW = currentHeaderW;
  savedZoomBarH   = 28;

  const viewW     = gameBody.offsetWidth;
  const gameBodyH = gameBody.offsetHeight;
  const panelH    = Math.floor(gameBodyH / 2);
  const toScaleX  = viewW / MEASURE_W;
  const toPanX    = viewW / 2 - (measureIndex + 0.5) * MEASURE_W * toScaleX;

  // Resolve instrument for this track
  const instrumentId = G && G.tracks[trackIndex] ? G.tracks[trackIndex].instrument : 'piano';

  // Prepare instrument panel — render content before animating in
  const panelTop = gameBodyH - panelH;
  instrumentPanel.style.top    = panelTop + 'px';
  instrumentPanel.style.bottom = '0';
  instrumentPanel.style.height = 'auto';
  instrumentPanel.style.transform = `translateY(101%)`;
  renderInstrument(instrumentId);

  animateMeasureZoom(
    { panX: savedPanX, scaleX: savedScaleX, panY, headerColW: currentHeaderW, zoomBarH: 28, targetRowH: 80, otherRowH: 80, gap: 4, panelY: 100 },
    { panX: toPanX,    scaleX: toScaleX,    panY: 0, headerColW: 0, zoomBarH: 0, targetRowH: panelH, otherRowH: 0, gap: 0, panelY: 0 },
    () => {
      updateTrackGrids();
      // Fade in back button
      backBtn.style.display = 'block';
      requestAnimationFrame(() => backBtn.style.opacity = '1');
    }
  );
}

function zoomOutMeasure() {
  if (!measureZoomed || zoomAnimFrame) return;

  const headerCol = document.getElementById('track-header-col');
  const gameBody  = document.getElementById('game-body');
  const backBtn   = document.getElementById('measure-back-btn');
  const gameBodyH = gameBody.offsetHeight;
  const panelH    = Math.floor(gameBodyH / 2);

  const currentHeaderW = drawerOpen ? HEADER_W_OPEN : HEADER_W_CLOSED;

  // Fade out back button, then animate
  backBtn.style.opacity = '0';
  setTimeout(() => {
    backBtn.style.display = 'none';
    animateMeasureZoom(
      { panX, scaleX, panY: 0, headerColW: 0, zoomBarH: 0, targetRowH: panelH, otherRowH: 0, gap: 0, panelY: 0 },
      { panX: savedPanX, scaleX: savedScaleX, panY: savedPanY, headerColW: savedHeaderColW, zoomBarH: savedZoomBarH, targetRowH: 80, otherRowH: 80, gap: 4, panelY: 100 },
      () => {
        measureZoomed = false;
        zoomedTrackIndex   = -1;
        zoomedMeasureIndex = -1;
        const restoredW = drawerOpen ? HEADER_W_OPEN : HEADER_W_CLOSED;
        headerCol.style.transition = '';
        headerList.style.transform = `translateY(${panY}px)`;
        headerCol.style.width = restoredW + 'px';
        document.getElementById('add-track-btn').style.width = restoredW + 'px';
        document.getElementById('zoom-bar').style.paddingLeft = (restoredW + 1) + 'px';
        document.getElementById('zoom-bar-wrap').style.height = '';
        document.getElementById('zoom-bar').style.transform = '';
        document.querySelectorAll('.track-header').forEach(h => {
          h.style.transition = '';
          h.style.width = restoredW + 'px';
        });
        document.querySelectorAll('.track-row').forEach(r => {
          r.style.height = '';
          r.style.borderTopWidth = '';
          r.style.borderBottomWidth = '';
        });
        document.getElementById('track-list').style.gap = '';
        instrumentPanel.style.height = '0';
        instrumentPanel.style.transform = '';
        instrumentPanel.style.top = '';
        instrumentPanel.style.bottom = '0';
        instrumentPanelInner.innerHTML = '';
        updateTrackGrids();
        applyTransform();
      }
    );
  }, 200); // wait for fade-out transition
}

function handleMeasureTap(cell, trackIndex, measureIndex) {
  const now = Date.now();
  if (lastTapCell === cell && now - lastTapTime < 350) {
    lastTapCell = null;
    lastTapTime = 0;
    zoomIntoMeasure(trackIndex, measureIndex);
  } else {
    lastTapCell = cell;
    lastTapTime = now;
    if (!measureZoomed) cell.classList.toggle('selected');
  }
}

let trackCount = 0;

function addTrack(name, instrument) {
  const index = document.getElementById('track-header-list').querySelectorAll('.track-header').length;

  const header = document.createElement('div');
  header.className = 'track-header';
  header.dataset.trackIndex = index;
  header.innerHTML = `
    <div class="track-header-inner" onclick="openEditTrackModal(${index})">
      <div class="track-header-identity">
        <div class="track-header-name"><div class="track-header-name-line">${splitTrackName(name)[0]}</div><div class="track-header-name-line">${splitTrackName(name)[1]}</div></div>
        <div class="track-icon">${instrument.icon}</div>
      </div>
      <div class="track-header-controls" onclick="event.stopPropagation()">
        <button class="track-ms-btn mute-btn" title="Mute">M</button>
        <button class="track-ms-btn solo-btn" title="Solo">S</button>
        <button class="track-ms-btn vol-btn" title="Volume">🔉</button>
      </div>
    </div>
    <button class="track-header-drawer-btn">❯</button>
  `;
  const drawerBtn = header.querySelector('.track-header-drawer-btn');
  drawerBtn.addEventListener('touchstart', e => { e.stopPropagation(); e.preventDefault(); toggleDrawer(); }, { passive: false });
  drawerBtn.addEventListener('click',      e => { e.stopPropagation(); toggleDrawer(); });

  header.querySelectorAll('.track-ms-btn').forEach(btn => {
    if (btn.classList.contains('vol-btn')) {
      btn.addEventListener('click',      e => { e.stopPropagation(); openVolumeModal(index); });
      btn.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });
    } else if (btn.classList.contains('mute-btn')) {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (!canEdit()) return;
        btn.classList.toggle('active');
        const muted = btn.classList.contains('active');
        const trackIdx = parseInt(header.dataset.trackIndex);
        header.classList.toggle('muted', muted);
        const rows = document.getElementById('track-list').querySelectorAll('.track-row');
        if (rows[trackIdx]) rows[trackIdx].classList.toggle('muted', muted);
        if (G && G.tracks[trackIdx]) { pushUndo(); G.tracks[trackIdx].muted = muted; }
      });
      btn.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });
    } else if (btn.classList.contains('solo-btn')) {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        btn.classList.toggle('active');
        applySolo();
      });
      btn.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });
    }
  });

  const btn = document.getElementById('add-track-btn');
  document.getElementById('track-header-list').insertBefore(header, btn);

  // Apply current drawer state
  if (drawerOpen) {
    const drawerBtn = header.querySelector('.track-header-drawer-btn');
    header.style.width = HEADER_W_OPEN + 'px';
    drawerBtn.textContent = '❮';
    header.querySelector('.track-header-name').style.display = 'block';
    header.querySelector('.track-header-controls').style.display = 'flex';
    header.querySelector('.track-header-inner').style.alignItems = 'center';
    header.querySelector('.track-header-inner').style.padding = '0.4rem 0.3rem';
  }

  const row = document.createElement('div');
  row.className = 'track-row';
  row.dataset.trackIndex = index;
  document.getElementById('track-list').appendChild(row);
  updateTrackGrids();
  buildMeasureCells(row);

  if (G && !G._rebuilding) { pushUndo(); G.tracks.push({ name, instrument: instrument.id, notes: [] }); }
  applyTransform();
}

// ── Turn History Modal ──
function openHistoryModal() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  const history = turnHistory || [];
  if (!history.length) {
    list.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:2rem;font-family:var(--mono);font-size:0.75rem;color:var(--text-faint);">No turns recorded yet.</div>';
  } else {
    history.forEach((entry, i) => {
      const date = new Date(entry.timestamp);
      const timeStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
        + ' ' + date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      const el = document.createElement('div');
      el.className = 'history-entry';
      el.dataset.index = i;
      el.innerHTML = `
        <div class="history-entry-header">
          <span class="history-entry-turn">Turn ${entry.turn}</span>
          <span class="history-entry-composer">${entry.composer || '—'}</span>
          ${entry.notes ? `<span class="history-entry-notes-inline">${entry.notes}</span>` : ''}
        </div>
        <div class="history-entry-time">${timeStr}</div>
      `;
      el.dataset.snapshot = entry.snapshot || '';
      el.addEventListener('click', () => {
        list.querySelectorAll('.history-entry').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('history-view-btn').disabled = false;
        document.getElementById('history-restore-btn').disabled = false;
      });
      list.appendChild(el);
    });
  }
  // Always append a "current" entry representing the state right now
  const now = new Date();
  const nowStr = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    + ' ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  const currentEl = document.createElement('div');
  currentEl.className = 'history-entry history-entry-current';
  currentEl.dataset.snapshot = isRestored ? (currentSnapshot || '') : (currentSnapshot = JSON.stringify(G));  currentEl.innerHTML = `
    <div class="history-entry-header">
      <span class="history-entry-turn">Turn ${G ? G.turnNumber : '—'}</span>
      <span class="history-entry-composer" style="color:var(--text-dim);font-style:italic;">Current</span>
      <span class="history-entry-time">${nowStr}</span>
    </div>
  `;
  currentEl.addEventListener('click', () => {
    list.querySelectorAll('.history-entry').forEach(e => e.classList.remove('selected'));
    currentEl.classList.add('selected');
    document.getElementById('history-view-btn').disabled = false;
    document.getElementById('history-restore-btn').disabled = false;
  });
  list.appendChild(currentEl);
  document.getElementById('history-view-btn').disabled = true;
  document.getElementById('history-restore-btn').disabled = true;
  document.getElementById('history-overlay').style.display = 'flex';
}
function restoreHistoryEntry() {
  const selected = document.getElementById('history-list').querySelector('.history-entry.selected');
  if (!selected || !selected.dataset.snapshot) return;
  G = JSON.parse(selected.dataset.snapshot);
  isRestored = !selected.classList.contains('history-entry-current');
  // turnHistory is untouched — it lives outside the snapshot
  updateUndoRedoBtns();
  refreshGameUI();
  closeHistoryModal();
  consoleMsg(isRestored ? `Viewing Turn ${G.turnNumber}. Return to Current to make changes.` : 'Returned to current.');
}
function hardRestoreHistoryEntry() {
  const selected = document.getElementById('history-list').querySelector('.history-entry.selected');
  if (!selected || !selected.dataset.snapshot) return;
  const turnNum = JSON.parse(selected.dataset.snapshot).turnNumber;
  pushUndo();
  G = JSON.parse(selected.dataset.snapshot);
  isRestored = false;
  currentSnapshot = null;
  updateUndoRedoBtns();
  refreshGameUI();
  closeHistoryModal();
  consoleMsg(`Composition restored to Turn ${turnNum}. You can undo this action.`);
}

function closeHistoryModal() {
  document.getElementById('history-overlay').style.display = 'none';
}

function consoleMsg(text) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = text;
  container.appendChild(toast);
  // Pop in
  requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('toast-visible')));
  // Fade out after 2s
  setTimeout(() => {
    toast.classList.remove('toast-visible');
    toast.classList.add('toast-hiding');
    setTimeout(() => toast.remove(), 200);
  }, 3000);
}

  TIME_SIGS.forEach(sig => {
    const btn = document.createElement('button');
    btn.className = 'timesig-option' + (sig === selectedTimeSig ? ' selected' : '');
    btn.textContent = sig;
    btn.onclick = () => {
      selectedTimeSig = sig;
      const p = sig.split('/');
      tsNum = parseInt(p[0]); tsDen = parseInt(p[1]);
      updateCustomDisplay();
      grid.querySelectorAll('.timesig-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });
  document.getElementById('timesig-overlay').style.display = 'flex';
}

function updateCustomDisplay() {
  document.getElementById('ts-num').textContent = tsNum;
  document.getElementById('ts-den').textContent = tsDen;
  selectedTimeSig = tsNum + '/' + tsDen;
  const grid = document.getElementById('timesig-grid');
  if (grid) {
    grid.querySelectorAll('.timesig-option').forEach(b => {
      b.classList.toggle('selected', b.textContent === selectedTimeSig);
    });
  }
}

const DEN_VALUES = [2, 4, 8, 16];
function stepTimeSig(part, delta) {
  if (!canEdit()) return;
  if (part === 'num') {
    tsNum = Math.min(16, Math.max(1, tsNum + delta));
  } else {
    const idx = DEN_VALUES.indexOf(tsDen);
    const next = idx + delta;
    if (next >= 0 && next < DEN_VALUES.length) tsDen = DEN_VALUES[next];
  }
  updateCustomDisplay();
}

function closeTimeSigModal() {
  stopMetronome();
  document.getElementById('timesig-overlay').style.display = 'none';
}

function confirmTimeSig() {
  if (!canEdit()) return;
  stopMetronome();
  setup.timeSig = selectedTimeSig;
  const disp = document.getElementById('f-timesig-display');
  if (disp) disp.textContent = selectedTimeSig;
  if (G) {
    pushUndo();
    G.timeSig = selectedTimeSig;
    document.getElementById('g-timesig').textContent = selectedTimeSig;
  }
  closeTimeSigModal();
  updateTrackGrids();
}

function toggleMetronome() {
  if (metronome.running) stopMetronome();
  else startMetronome();
}
function startMetronome() {
  metronome.ctx = new (window.AudioContext || window.webkitAudioContext)();
  metronome.running = true;
  metronome.beat = 0;
  document.getElementById('metro-btn').textContent = '⏹';
  scheduleBeat();
}
function stopMetronome() {
  metronome.running = false;
  if (metronome.timeout) clearTimeout(metronome.timeout);
  const btn = document.getElementById('metro-btn');
  if (btn) btn.textContent = '▶';
}
function scheduleBeat() {
  if (!metronome.running) return;
  const bpm = G ? G.bpm : setup.bpm;
  const isAccent = metronome.beat % tsNum === 0;
  const ctx = metronome.ctx;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = isAccent ? 1000 : 700;
  gain.gain.setValueAtTime(isAccent ? 0.4 : 0.2, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  osc.start(now);
  osc.stop(now + 0.08);
  metronome.beat = (metronome.beat + 1) % tsNum;
  metronome.timeout = setTimeout(scheduleBeat, (60 / bpm) * 1000);
}

// ── Rules Modal ──
function openRulesModal() {
  const current = G ? G.measuresPerTurn : setup.quota;
  document.getElementById('quota-input').value = current;
  document.getElementById('rules-overlay').style.display = 'flex';
}
function closeRulesModal() {
  document.getElementById('rules-overlay').style.display = 'none';
}
function confirmRules() {
  if (!canEdit()) return;
  const val = parseInt(document.getElementById('quota-input').value);
  if (val >= 1 && val <= 32) {
    setup.quota = val;
    const disp = document.getElementById('f-quota-display');
    if (disp) disp.textContent = val;
    if (G) {
      pushUndo();
      G.measuresPerTurn = val;
      document.getElementById('g-quota').textContent = val;
    }
  }
  closeRulesModal();
}
function stepQuota(delta) {
  const input = document.getElementById('quota-input');
  input.value = Math.min(32, Math.max(1, (parseInt(input.value) || 4) + delta));
}

// ── BPM Modal ──
let bpmMetronome = { running: false, ctx: null, beat: 0, timeout: null };

function openBpmModal() {
  const current = G ? G.bpm : setup.bpm;
  document.getElementById('bpm-input').value = current;
  document.getElementById('bpm-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('bpm-input').focus(), 50);
}
function closeBpmModal() {
  stopBpmMetronome();
  document.getElementById('bpm-overlay').style.display = 'none';
}
function confirmBpm() {
  if (!canEdit()) return closeBpmModal();
  const val = parseInt(document.getElementById('bpm-input').value);
  if (val >= 40 && val <= 240) {
    setup.bpm = val;
    const disp = document.getElementById('f-bpm-display');
    if (disp) disp.textContent = val;
    if (G) {
      pushUndo();
      G.bpm = val;
      document.getElementById('g-bpm').textContent = val;
    }
  }
  closeBpmModal();
}
function stepBpm(delta) {
  const input = document.getElementById('bpm-input');
  input.value = Math.min(240, Math.max(40, (parseInt(input.value) || 120) + delta));
}
function toggleBpmMetronome() {
  if (bpmMetronome.running) stopBpmMetronome();
  else startBpmMetronome();
}
function startBpmMetronome() {
  bpmMetronome.ctx = new (window.AudioContext || window.webkitAudioContext)();
  bpmMetronome.running = true;
  bpmMetronome.beat = 0;
  document.getElementById('bpm-metro-btn').textContent = '⏹';
  scheduleBpmBeat();
}
function stopBpmMetronome() {
  bpmMetronome.running = false;
  if (bpmMetronome.timeout) clearTimeout(bpmMetronome.timeout);
  const btn = document.getElementById('bpm-metro-btn');
  if (btn) btn.textContent = '▶';
}
function scheduleBpmBeat() {
  if (!bpmMetronome.running) return;
  const bpm = parseInt(document.getElementById('bpm-input').value) || 120;
  const sig = G ? G.timeSig : setup.timeSig;
  const beats = parseInt(sig.split('/')[0]) || 4;
  const isAccent = bpmMetronome.beat % beats === 0;
  const ctx = bpmMetronome.ctx;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = isAccent ? 1000 : 700;
  gain.gain.setValueAtTime(isAccent ? 0.4 : 0.2, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  osc.start(now);
  osc.stop(now + 0.08);
  bpmMetronome.beat = (bpmMetronome.beat + 1) % beats;
  bpmMetronome.timeout = setTimeout(scheduleBpmBeat, (60 / bpm) * 1000);
}

// ── Keyboard shortcuts ──
// ── Orientation / Resize ──
window.addEventListener('resize', () => {
  clearTimeout(window._resizeTimer);
  window._resizeTimer = setTimeout(() => {
    if (!G) return;
    if (measureZoomed) {
      // Recalculate all zoom geometry from fresh dimensions
      const gameBody    = document.getElementById('game-body');
      const viewW       = gameBody.offsetWidth;
      const gameBodyH   = gameBody.offsetHeight;
      const panelH      = Math.floor(gameBodyH / 2);
      const panelTop    = gameBodyH - panelH;
      const toScaleX    = viewW / MEASURE_W;
      const toPanX      = viewW / 2 - (zoomedMeasureIndex + 0.5) * MEASURE_W * toScaleX;

      // Reposition panel
      instrumentPanel.style.top    = panelTop + 'px';
      instrumentPanel.style.bottom = '0';
      instrumentPanel.style.height = 'auto';
      instrumentPanel.style.transform = 'translateY(0%)';

      // Reapply zoom transform
      scaleX = toScaleX;
      panX   = toPanX;

      // Resize track rows
      document.querySelectorAll('.track-row').forEach((row, i) => {
        row.style.height = (i === zoomedTrackIndex ? panelH : 0) + 'px';
        row.style.border = '0';
      });
      document.querySelectorAll('.track-header').forEach((h, i) => {
        h.style.height = (i === zoomedTrackIndex ? panelH : 0) + 'px';
        h.style.border = '0';
      });

      applyZoom();
      applyTransform();
      renderInstrument(G.tracks[zoomedTrackIndex] ? G.tracks[zoomedTrackIndex].instrument : 'piano');
    } else {
      applyZoom();
      applyTransform();
    }
  }, 150);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('bpm-overlay').style.display === 'flex') {
    confirmBpm();
  }
  if (e.key === 'Escape') {
    if (document.getElementById('bpm-overlay').style.display === 'flex') closeBpmModal();
    if (document.getElementById('timesig-overlay').style.display === 'flex') closeTimeSigModal();
    if (document.getElementById('volume-overlay').style.display === 'flex') closeVolumeModal();
    if (document.getElementById('new-track-overlay').style.display === 'flex') closeNewTrackModal();
    if (document.getElementById('instrument-picker-overlay').style.display === 'flex') closeInstrumentPicker();
    if (document.getElementById('info-overlay').style.display === 'flex') closeInfoModal();
    document.getElementById('toolbar-menu').classList.remove('open');
  }
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measures</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #1c1c1e;
  --surface:    #252528;
  --raised:     #2e2e32;
  --border:     #3a3a3f;
  --border2:    #48484f;
  --text:       #e2e2e6;
  --text-dim:   #888896;
  --text-faint: #555560;
  --green:      #4ade80;
  --sans:       'IBM Plex Sans', system-ui, sans-serif;
  --mono:       'IBM Plex Mono', monospace;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.screen { display: none; }
.screen.active { display: flex; }

/* ══ WELCOME ══ */
#screen-welcome {
  min-height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  position: relative;
  overflow: hidden;
}

#screen-welcome::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.4;
}

#screen-welcome::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, var(--bg) 100%);
}

.welcome-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.5rem;
}

.logo {
  font-family: var(--mono);
  font-size: 3.5rem;
  font-weight: 500;
  letter-spacing: 2px;
  color: var(--text);
  text-align: center;
  display: flex;
  align-items: center;
  text-transform: uppercase;
}

.logo-e-svg {
  height: 0.85em;
  width: auto;
  overflow: visible;
  margin: 0 0.07em;
  align-self: baseline;
  flex-shrink: 0;
}

.tagline {
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text-faint);
  text-align: center;
  margin-top: 0.75rem;
}

/* ══ BUTTONS ══ */
.btn {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0.65rem 1.4rem;
  border: 1px solid var(--border2);
  background: var(--raised);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.1s;
}
.btn:hover { border-color: var(--text-dim); color: var(--text); background: var(--border); }
.btn.primary { background: var(--green); border-color: var(--green); color: #0a1a10; font-weight: 600; }
.btn.primary:hover { background: #6aea98; border-color: #6aea98; }

/* ══ SETUP ══ */
#screen-setup {
  min-height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  position: relative;
}

#screen-setup::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.2;
}

.panel {
  position: relative;
  z-index: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 420px;
}

.panel-titlebar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 1rem;
  background: var(--raised);
  border-bottom: 1px solid var(--border);
}

.titlebar-dots { display: flex; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border2); }

.panel-title {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 1px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-left: 0.25rem;
}

.panel-body {
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}

.field { display: flex; flex-direction: column; gap: 0.3rem; }
.field label {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-faint);
}
.field input,
.field select {
  font-family: var(--mono);
  font-size: 1rem;
  padding: 0.5rem 0.6rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  transition: border-color 0.1s;
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
}
.field input:focus,
.field select:focus { outline: none; border-color: var(--green); }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.field-row-3 { grid-template-columns: 1fr 1fr 1fr; }

.setup-stat-btn {
  font-family: var(--mono);
  font-size: 1rem;
  width: 100%;
  padding: 0.45rem 0.6rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.1s;
}
.setup-stat-btn:hover { border-color: var(--text-dim); color: var(--text); }
.setup-stat-btn:focus { outline: none; }

.field textarea {
  font-family: var(--mono);
  font-size: 1rem;
  padding: 0.5rem 0.6rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  transition: border-color 0.1s;
  width: 100%;
  resize: none;
  line-height: 1.5;
}
.field textarea:focus { outline: none; border-color: var(--green); }

.panel-footer {
  display: flex;
  gap: 0.5rem;
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border);
  background: var(--raised);
}
.panel-footer .btn { flex: 1; }

/* ══ GAME ══ */
#screen-game { height: 100vh; flex-direction: column; }

#game-toolbar {
  height: 38px;
  background: var(--raised);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0;
  flex-shrink: 0;
  /* NO overflow:hidden — must allow dropdown to escape */
  min-width: 0;
}

#game-toolbar2 {
  height: 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0;
  flex-shrink: 0;
  width: 100%;
}

.toolbar-logo-wrap {
  position: relative;
  flex-shrink: 0;
}

.toolbar-logo {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-right: 1px solid var(--border);
  background: none;
  cursor: pointer;
  transition: background 0.1s;
}
.toolbar-logo:hover { background: var(--border); }
.toolbar-logo:focus { outline: none; }

/* Fixed positioning so overflow:hidden on any ancestor can't clip it */
.toolbar-dropdown {
  display: none;
  position: fixed;
  min-width: 160px;
  background: var(--raised);
  border: 1px solid var(--border);
  z-index: 500;
  flex-direction: column;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.toolbar-dropdown.open { display: flex; }

.dropdown-item {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0.65rem 1rem;
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  text-align: left;
  transition: background 0.1s, color 0.1s;
}
.dropdown-item:hover { background: var(--border); color: var(--text); }

.toolbar-composers {
  font-family: var(--sans);
  font-size: 0.75rem;
  font-weight: 300;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 1rem 0 0.5rem;
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
  height: 38px;
  transition: background 0.1s;
}
.toolbar-composers:hover { background: var(--border); }
.toolbar-composers:focus { outline: none; }
.toolbar-composers:empty { display: none; }

.toolbar-name {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text);
  flex-shrink: 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 0 0 1rem;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
  height: 38px;
  transition: background 0.1s;
}
.toolbar-name:hover { background: var(--border); }
.toolbar-name:focus { outline: none; }

.toolbar-undoredo {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  margin-left: auto;
  border-left: 1px solid var(--border);
}
.toolbar-undoredo-btn {
  width: 36px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--text);
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  flex-shrink: 0;
}
.toolbar-undoredo-btn:hover:not(:disabled) { background: var(--border); }
.toolbar-undoredo-btn:disabled { color: var(--text-faint); cursor: default; }
.toolbar-undoredo-btn:focus { outline: none; }

.toolbar-stats { display: flex; align-items: center; flex-shrink: 0; }

.tstat {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0 0.6rem;
  border-left: 1px solid var(--border);
  height: 32px;
}

.tstat-btn {
  flex: 1;
  background: none;
  border: none;
  border-left: 1px solid var(--border);
  cursor: pointer;
  height: 32px;
  padding: 0 0.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  transition: background 0.1s;
}
.tstat-btn:hover { background: var(--border); }
.tstat-btn:hover .tstat-label,
.tstat-btn:hover .tstat-value { color: var(--text); }

.end-turn-btn {
  background: var(--green) !important;
  border-left: 1px solid var(--green) !important;
  font-family: var(--mono);
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.end-turn-btn:hover { background: #6aea98 !important; border-color: #6aea98 !important; }
.end-turn-btn span { color: #0a1a10 !important; }

.tstat-label {
  font-family: var(--mono);
  font-size: 0.52rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-faint);
}
.tstat-value {
  font-family: var(--mono);
  font-size: 0.82rem;
  color: var(--text);
}
.tstat-value.highlight { color: var(--green); }

#zoom-bar-wrap {
  height: 28px;
  flex-shrink: 0;
  overflow: hidden;
}
#zoom-bar {
  height: 28px;
  background: #0e0e10;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 4px 0 48px;
}

#zoom-track {
  flex: 1;
  height: 14px;
  background: var(--surface);
  border-radius: 7px;
  position: relative;
}

#zoom-thumb {
  position: absolute;
  top: 0;
  height: 100%;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  border-radius: 7px;
  overflow: visible;
}

.zoom-handle {
  width: 12px;
  flex-shrink: 0;
  background: var(--text-dim);
  border-radius: 7px;
  cursor: ew-resize;
  transition: background 0.1s;
}
.zoom-handle:hover { background: var(--text); }

#zoom-body {
  flex: 1;
  background: var(--text-faint);
  cursor: grab;
  transition: background 0.1s;
  min-width: 10px;
}
#zoom-body:hover  { background: var(--text-dim); }
#zoom-body:active { cursor: grabbing; }

#game-body {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: var(--bg);
  touch-action: none;
  min-height: 0;
  display: flex;
  flex-direction: row;
}

#track-header-col {
  width: 47px;
  flex-shrink: 0;
  background: #0e0e10;
  overflow: hidden;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  transition: width 0.2s ease;
}

#track-header-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  transform-origin: 0 0;
}

#track-header-spacer {
  flex: 1;
}

#roll-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
}

#roll-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 15360px;
  height: 2000px;
  transform-origin: 0 0;
  background-color: #0e0e10;
}

#track-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.track-row.muted, .track-header.muted .track-header-identity,
.track-row.soloed-out, .track-header.soloed-out .track-header-identity,
.track-row.silent, .track-header.silent .track-header-identity {
  opacity: 0.35;
  filter: grayscale(1);
}
.track-row {
  height: 80px;
  width: 15360px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}



.measure-cell {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.1s;
}
.measure-cell:hover    { background: rgba(255,255,255,0.04); }
.measure-cell.selected { background: rgba(0,200,255,0.18); box-shadow: inset 0 0 0 1px rgba(0,200,255,0.45); }

.track-header {
  height: 80px;
  flex-shrink: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-right: none;
  border-left: none;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  cursor: default;
  overflow: hidden;
  transition: width 0.2s ease;
  width: 47px;
}

.track-header-inner {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 0.4rem 0.3rem;
  gap: 0.2rem;
  cursor: pointer;
  transition: background 0.1s;
  overflow: hidden;
}
.track-header-inner:hover { background: var(--raised); }

.track-header-identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.2rem;
}

.track-header-drawer-btn {
  width: 18px;
  flex-shrink: 0;
  background: var(--raised);
  border: none;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border2);
  color: var(--text-faint);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  box-sizing: border-box;
  font-size: 0.5rem;
  line-height: 1;
  transition: background 0.1s, color 0.1s;
}
.track-header-drawer-btn:hover { background: var(--border); color: var(--text); }
.track-header-drawer-btn:focus { outline: none; }

.track-header-name {
  display: none;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
  text-align: center;
}
.track-header-name-line {
  white-space: nowrap;
  overflow: hidden;
}

.track-header-controls {
  display: none;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}

.track-ms-btn {
  width: 18px;
  height: 18px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-faint);
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
  transition: all 0.1s;
}
.track-ms-btn:focus { outline: none; }
.track-ms-btn.mute-btn:hover                    { border-color: var(--text-dim); color: var(--text); }
.track-ms-btn.mute-btn.active                   { border-color: #f97316; color: #f97316; background: rgba(249,115,22,0.15); }
.track-ms-btn.mute-btn.active:hover             { border-color: #f97316; color: #f97316; }
.track-ms-btn.solo-btn:hover                    { border-color: var(--text-dim); color: var(--text); }
.track-ms-btn.solo-btn.active                   { border-color: #facc15; color: #facc15; background: rgba(250,204,21,0.15); }
.track-ms-btn.solo-btn.active:hover             { border-color: #facc15; color: #facc15; }
.track-ms-btn.vol-btn:hover   { border-color: var(--green); color: var(--green); }
.track-ms-btn.vol-btn.active  { border-color: var(--green); color: var(--green); background: rgba(74,222,128,0.15); }


#add-track-btn {
  width: 47px;
  height: 36px;
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 1.2rem;
  background: var(--surface);
  border: none;
  border-top: 1px dashed var(--border2);
  border-bottom: 1px dashed var(--border2);
  color: var(--text-faint);
  cursor: pointer;
  transition: all 0.15s, width 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
#add-track-btn:hover { background: var(--border); color: var(--green); }
#add-track-btn:focus { outline: none; }

/* ── Toast notifications ── */
#toast-container {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 80vw;
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.toast {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.4px;
  color: var(--text);
  background: rgba(30,30,34,0.92);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 0.35rem 0.9rem;
  max-width: 80vw;
  white-space: normal;
  text-align: center;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.toast-visible {
  opacity: 1;
  transform: translateY(0);
}
.toast.toast-hiding {
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.15s ease, transform 0.15s ease;
}

#measure-back-btn {
  display: none;
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 20;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--green);
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px;
  padding: 0.3rem 0.65rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s ease;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
#measure-back-btn:focus { outline: none; }
#instrument-panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 0;
  overflow: hidden;
  z-index: 5;
  background: #111113;
}
#instrument-panel-inner {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

/* ── Composer Suggestions ── */
#composer-suggestions {
  position: absolute;
  left: 0;
  right: 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--raised);
  overflow-y: auto;
  max-height: calc(4 * 2.4rem);
  z-index: 10;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.composer-suggestion {
  padding: 0.55rem 0.6rem;
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text);
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.composer-suggestion:last-child { border-bottom: none; }
.composer-suggestion:active { background: var(--border); }

/* ── Turn History ── */
.history-entry {
  padding: 0.6rem 0.75rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
}
.history-entry:last-child { border-bottom: none; }
.history-entry:hover { background: var(--raised); }
.history-entry.selected { background: rgba(74,222,128,0.08); border-left: 2px solid var(--green); padding-left: calc(0.75rem - 2px); }
.history-entry-current { border-top: 1px solid var(--border); }
.history-entry-header {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}
.history-entry-turn {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--green);
  flex-shrink: 0;
}
.history-entry-composer {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--text);
  flex-shrink: 0;
}
.history-entry-notes-inline {
  font-family: var(--sans);
  font-size: 0.72rem;
  color: var(--text-dim);
  flex: 1;
  margin-left: auto;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-entry-time {
  margin-top: 0.2rem;
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text-faint);
}

/* ── Drum Pads ── */
#drum-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 6px;
  padding: 6px;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}
.drum-pad {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  overflow: hidden;
  transition: filter 0.05s;
  gap: 4px;
}
.drum-pad:active, .drum-pad.pressed {
  filter: brightness(1.4);
}
.drum-pad-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  pointer-events: none;
}
.drum-pad-icon {
  font-size: 1.4rem;
  line-height: 1;
  pointer-events: none;
}

/* ── Piano ── */
#piano-container {
  width: 100%;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  position: relative;
  background: var(--bg);
}
#piano-keys {
  position: relative;
  height: calc(100% - 4px);
  margin-top: 4px;
  display: inline-flex;
  flex-direction: row;
  padding: 0 16px;
  box-sizing: border-box;
  gap: 0;
}
.piano-white {
  width: 44px;
  height: 100%;
  background: linear-gradient(180deg, #e8e8e8 0%, #ffffff 100%);
  border: 1px solid #555;
  border-radius: 0 0 6px 6px;
  box-sizing: border-box;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
  transition: background 0.05s;
  user-select: none;
  -webkit-user-select: none;
}
.piano-white:active, .piano-white.pressed {
  background: linear-gradient(180deg, #b8e8ff 0%, #d0f0ff 100%);
}
.piano-white-label {
  position: absolute;
  bottom: 6px;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 0.45rem;
  color: rgba(0,0,0,0.35);
  pointer-events: none;
  user-select: none;
}
.piano-black {
  width: 28px;
  background: linear-gradient(180deg, #222 0%, #444 100%);
  border: 1px solid #000;
  border-radius: 0 0 4px 4px;
  box-sizing: border-box;
  position: absolute;
  top: 0;
  z-index: 2;
  cursor: pointer;
  transition: background 0.05s;
  user-select: none;
  -webkit-user-select: none;
}
.piano-black:active, .piano-black.pressed {
  background: linear-gradient(180deg, #004080 0%, #0066cc 100%);
}
/* ── Instrument Panel ── */
.instrument-selector {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  padding: 0.5rem 0.75rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.1s;
}
.instrument-selector:hover { border-color: var(--text-dim); }
.instrument-selector:focus { outline: none; }
.instrument-selector-icon { font-size: 1.4rem; line-height: 1; }
.instrument-selector-name { font-family: var(--mono); font-size: 0.9rem; flex: 1; }
.instrument-selector-chevron { font-family: var(--mono); font-size: 1.2rem; color: var(--text-faint); }

.instrument-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  padding: 1rem 0.75rem;
  background: var(--raised);
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  min-width: 80px;
  flex-shrink: 0;
}
.instrument-option:hover { border-color: var(--text-dim); }
.instrument-option.selected { border-color: var(--green); background: rgba(74,222,128,0.08); }
.instrument-option-icon { font-size: 2rem; line-height: 1; }
.instrument-option-name {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
}
.instrument-option.selected .instrument-option-name { color: var(--green); }
#instrument-list::-webkit-scrollbar { display: none; }

.timesig-custom {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.timesig-custom-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}
.timesig-digit {
  font-family: var(--mono);
  font-size: 2rem;
  font-weight: 500;
  color: var(--text);
  min-width: 2rem;
  text-align: center;
  line-height: 1;
}
.timesig-slash {
  font-family: var(--mono);
  font-size: 2rem;
  color: var(--text-dim);
  line-height: 1;
  margin-bottom: 0.1rem;
}
.timesig-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
}
.timesig-option {
  font-family: var(--mono);
  font-size: 0.95rem;
  padding: 0.65rem 0.5rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  text-align: center;
  transition: all 0.1s;
}
.timesig-option:hover { border-color: var(--text-dim); color: var(--text); }
.timesig-option.selected { background: var(--green); border-color: var(--green); color: #0a1a10; font-weight: 600; }

.num-stepper {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
}
.num-stepper input {
  flex: 1;
  border: none;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  text-align: center;
  min-width: 0;
}
.num-stepper input:focus { outline: none; border-color: var(--border); }
.stepper-btn {
  font-family: var(--mono);
  font-size: 1.1rem;
  width: 40px;
  height: 40px;
  background: var(--raised);
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stepper-btn:hover { background: var(--border); color: var(--text); }
</style>
</head>

<script>
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let G = null;
let turnHistory = [];
let isRestored = false;
let currentSnapshot = null;
let setup = { bpm: 120, timeSig: '4/4', quota: 4 };

// ── Undo / Redo ──
const UNDO_MAX = 500;
const undoStack = [];
const redoStack = [];

function canEdit() {
  if (!isRestored) return true;
  consoleMsg('Return to Current to make changes.');
  return false;
}

function pushUndo() {
  if (!G) return;
  undoStack.push(JSON.stringify(G));
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
  updateUndoRedoBtns();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(G));
  G = JSON.parse(undoStack.pop());
  refreshGameUI();
  updateUndoRedoBtns();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(G));
  G = JSON.parse(redoStack.pop());
  refreshGameUI();
  updateUndoRedoBtns();
}

function updateUndoRedoBtns() {
  const u = document.getElementById('undo-btn');
  const r = document.getElementById('redo-btn');
  if (u) u.disabled = isRestored || undoStack.length === 0;
  if (r) r.disabled = isRestored || redoStack.length === 0;
}

function refreshGameUI() {
  document.getElementById('g-name').textContent      = G.name;
  document.getElementById('g-composers').textContent = G.composers && G.composers.length ? 'by: ' + G.composers.join(', ') : '';
  document.getElementById('g-bpm').textContent       = G.bpm;
  document.getElementById('g-timesig').textContent   = G.timeSig;
  document.getElementById('g-quota').textContent     = G.measuresPerTurn;
  document.getElementById('g-end-turn-label').textContent = 'End Turn ' + G.turnNumber;
  // Rebuild track DOM only — do NOT call addTrack() which mutates G.tracks
  const headerList = document.getElementById('track-header-list');
  const trackList  = document.getElementById('track-list');
  headerList.querySelectorAll('.track-header').forEach(el => el.remove());
  trackList.querySelectorAll('.track-row').forEach(el => el.remove());
  const savedTracks = G.tracks.slice();
  G._rebuilding = true;
  G.tracks = [];
  savedTracks.forEach(t => addTrack(t.name, INSTRUMENTS.find(i => i.id === t.instrument) || INSTRUMENTS[0]));
  G._rebuilding = false;
  G.tracks = savedTracks; // restore correct state — addTrack DOM rebuild only
  updateTrackGrids();
  applyZoom();
}

function startGame() {
  const name = document.getElementById('f-name').value.trim() || 'Untitled';
  G = {
    version: 1, name,
    composers: [], notes: '',
    bpm: setup.bpm, timeSig: setup.timeSig,
    measuresPerTurn: setup.quota,
    turnNumber: 1, tracks: []
  };
  document.getElementById('g-name').textContent      = name;
  document.getElementById('g-composers').textContent = '';
  document.getElementById('g-bpm').textContent       = setup.bpm;
  document.getElementById('g-timesig').textContent = setup.timeSig;
  document.getElementById('g-quota').textContent   = setup.quota;
  document.getElementById('g-end-turn-label').textContent = 'End Turn 1';
  turnHistory = [];
  isRestored = false;
  currentSnapshot = null;
  show('screen-game');
}

// ── Menu ──
let menuClosedAt = 0;

function toggleMenu() {
  const menu = document.getElementById('toolbar-menu');
  const btn  = document.getElementById('menu-btn');
  const opening = !menu.classList.contains('open');
  menu.classList.toggle('open', opening);
  if (opening) {
    const rect = btn.getBoundingClientRect();
    menu.style.top  = rect.bottom + 'px';
    menu.style.left = rect.left + 'px';
  } else {
    menuClosedAt = Date.now();
  }
}

document.addEventListener('click', e => {
  const menu = document.getElementById('toolbar-menu');
  const btn  = document.getElementById('menu-btn');
  if (menu && btn && !btn.contains(e.target) && !menu.contains(e.target)) {
    if (menu.classList.contains('open')) menuClosedAt = Date.now();
    menu.classList.remove('open');
  }
});

// Capture-phase listener blocks ghost clicks within 350ms of menu closing
document.addEventListener('click', e => {
  if (Date.now() - menuClosedAt < 350 &&
      !document.getElementById('menu-btn').contains(e.target) &&
      !document.getElementById('toolbar-menu').contains(e.target)) {
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

function exportToClipboard(e) {
  e && e.stopPropagation();
  menuClosedAt = Date.now();
  document.getElementById('toolbar-menu').classList.remove('open');
  if (!G) return;
  const json = JSON.stringify(G, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    consoleMsg('Copied to clipboard.');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = json;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    consoleMsg('Copied to clipboard.');
  });
}

function endTurn() {
  if (!G || !canEdit()) return;
  document.getElementById('composer-name-input').value = '';
  document.getElementById('turn-notes-input').value = '';
  const input = document.getElementById('composer-name-input');
  const suggestions = document.getElementById('composer-suggestions');
  suggestions.innerHTML = '';
  suggestions.style.display = 'none';
  if (G && G.composers && G.composers.length) {
    G.composers.forEach(name => {
      const opt = document.createElement('div');
      opt.className = 'composer-suggestion';
      opt.textContent = name;
      opt.addEventListener('mousedown', e => {
        e.preventDefault();
        input.value = name;
        input.blur();
        suggestions.style.display = 'none';
      });
      opt.addEventListener('touchstart', e => {
        e.preventDefault();
        input.value = name;
        input.blur();
        suggestions.style.display = 'none';
      }, { passive: false });
      suggestions.appendChild(opt);
    });
    input.addEventListener('focus', () => { suggestions.style.display = 'block'; });
    input.addEventListener('blur', () => { setTimeout(() => { suggestions.style.display = 'none'; }, 100); });
  }
  document.getElementById('composer-overlay').style.display = 'flex';

}
function closeComposerPrompt() {
  document.getElementById('composer-overlay').style.display = 'none';
}
function confirmEndTurn() {
  if (!G) return closeComposerPrompt();
  const name = document.getElementById('composer-name-input').value.trim();
  if (!name) { consoleMsg('Please enter your name to end the turn.'); return; }
  closeComposerPrompt();
  // Add composer if name given and not already in list (case-insensitive)
  if (name) {
    const already = G.composers.some(c => c.toLowerCase() === name.toLowerCase());
    if (!already) {
      G.composers.push(name);
      document.getElementById('g-composers').textContent = 'by: ' + G.composers.join(', ');
    }
  }
  isRestored = false;
  updateUndoRedoBtns();
  // Record turn history entry — snapshot is composition only, not turnHistory
  const turnNotes = document.getElementById('turn-notes-input').value.trim();
  turnHistory.push({
    turn: G.turnNumber,
    composer: name || null,
    timestamp: new Date().toISOString(),
    notes: turnNotes || null,
    snapshot: JSON.stringify(G),
  });
  G.turnNumber += 1;
  document.getElementById('g-end-turn-label').textContent = 'End Turn ' + G.turnNumber;
  const json = JSON.stringify({ composition: G, turnHistory }, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    consoleMsg(`Turn ${G.turnNumber - 1} ended. State copied to clipboard — share it with the next player.`);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = json;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    consoleMsg(`Turn ${G.turnNumber - 1} ended. State copied to clipboard — share it with the next player.`);
  });
}

// ── Pan & Zoom ──
const viewport    = document.getElementById('roll-viewport');
const canvas      = document.getElementById('roll-canvas');
const headerList  = document.getElementById('track-header-list');

let panX = 0, panY = 0;
let scaleX = 1;
let velX = 0, velY = 0;
let zoomAnimFrame = null;
let inertiaFrame = null;
const FRICTION = 0.92;
const CANVAS_BASE_W = 15360; // kept for zoom bar math
const MEASURE_W = 120;
const TOTAL_MEASURES = 128;


function applyTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px)`;
  canvas.style.transformOrigin = '0 0';
  if (!zoomAnimFrame) headerList.style.transform = `translateY(${panY}px)`;
  updateZoomBar();
}

function clampPan() {
  const rect = viewport.getBoundingClientRect();
  const canvasW = TOTAL_MEASURES * MEASURE_W * scaleX;
  panX = Math.min(0, Math.max(rect.width  - canvasW, panX));
  panY = Math.min(0, Math.max(rect.height - canvas.offsetHeight, panY));
}

function applyZoom() {
  const canvasW = TOTAL_MEASURES * MEASURE_W * scaleX;
  canvas.style.width = canvasW + 'px';
  updateTrackGrids();
  clampPan();
  applyTransform();
}

// ── Zoom Scrollbar ──
const zoomTrack   = document.getElementById('zoom-track');
const zoomThumb   = document.getElementById('zoom-thumb');
const zoomBody    = document.getElementById('zoom-body');
const zoomHandleL = document.getElementById('zoom-handle-l');
const zoomHandleR = document.getElementById('zoom-handle-r');

const MIN_SCALE = 0.05;
const MAX_SCALE = 8;
// Thumb fraction range — thumb is always this proportion of the track, regardless of zoom
const MIN_THUMB_FRAC = 0.12;
const MAX_THUMB_FRAC = 0.88;

// Convert thumb width fraction → scaleX (logarithmic)
function thumbFracToScale(frac) {
  const t = (frac - MIN_THUMB_FRAC) / (MAX_THUMB_FRAC - MIN_THUMB_FRAC);
  // Wide thumb = zoomed out (low scale), narrow thumb = zoomed in (high scale)
  return Math.exp(Math.log(MAX_SCALE) + t * (Math.log(MIN_SCALE) - Math.log(MAX_SCALE)));
}

// Convert scaleX → thumb width fraction (inverse)
function scaleToThumbFrac(s) {
  const t = (Math.log(s) - Math.log(MAX_SCALE)) / (Math.log(MIN_SCALE) - Math.log(MAX_SCALE));
  return MIN_THUMB_FRAC + t * (MAX_THUMB_FRAC - MIN_THUMB_FRAC);
}

// Convert thumb left fraction (0–1 of usable range) → panX
function thumbPosToPanX(posFrac, trackW, thumbW) {
  const usable = trackW - thumbW;
  const totalScrollable = TOTAL_MEASURES * MEASURE_W * scaleX - viewport.offsetWidth;
  return -(posFrac * usable / (usable || 1)) * totalScrollable;
}

// Convert panX → thumb left fraction
function panXToThumbPosFrac(trackW, thumbW) {
  const totalScrollable = CANVAS_BASE_W * scaleX - viewport.offsetWidth;
  if (totalScrollable <= 0) return 0;
  const usable = trackW - thumbW;
  return (-panX / totalScrollable) * (usable / (usable || 1));
}

function updateZoomBar() {
  const trackW  = zoomTrack.offsetWidth;
  const thumbFrac = scaleToThumbFrac(scaleX);
  const thumbW  = thumbFrac * trackW;
  const canvasW = TOTAL_MEASURES * MEASURE_W * scaleX;
  const totalScrollable = canvasW - viewport.offsetWidth;
  const posFrac = totalScrollable > 0 ? (-panX / totalScrollable) : 0;
  const usable  = trackW - thumbW;
  const thumbL  = Math.max(0, Math.min(usable, posFrac * usable));
  zoomThumb.style.width = thumbW + 'px';
  zoomThumb.style.left  = thumbL + 'px';
}

function applyFromThumb(thumbL, thumbW) {
  const trackW = zoomTrack.offsetWidth;
  const frac   = thumbW / trackW;
  scaleX = thumbFracToScale(Math.max(MIN_THUMB_FRAC, Math.min(MAX_THUMB_FRAC, frac)));
  const posFrac = thumbL / Math.max(1, trackW - thumbW);
  panX = thumbPosToPanX(posFrac, trackW, thumbW);
  applyZoom();
}

// Body drag — pan only, preserves zoom
let zbDrag = null;
function startZbDrag(clientX) {
  const tr = zoomTrack.getBoundingClientRect();
  const th = zoomThumb.getBoundingClientRect();
  zbDrag = { startX: clientX, startL: th.left - tr.left, thumbW: th.width };
}
zoomBody.addEventListener('mousedown', e => { e.stopPropagation(); startZbDrag(e.clientX); window.addEventListener('mousemove', onZbMove); window.addEventListener('mouseup', onZbUp); });
zoomBody.addEventListener('touchstart', e => { e.stopPropagation(); e.preventDefault(); startZbDrag(e.touches[0].clientX); window.addEventListener('touchmove', onZbMoveT, { passive: false }); window.addEventListener('touchend', onZbUpT); }, { passive: false });
function onZbMove(e) {
  if (!zbDrag) return;
  const trackW = zoomTrack.offsetWidth;
  const dx = e.clientX - zbDrag.startX;
  const newL = Math.max(0, Math.min(trackW - zbDrag.thumbW, zbDrag.startL + dx));
  applyFromThumb(newL, zbDrag.thumbW);
}
function onZbMoveT(e) { e.preventDefault(); onZbMove(e.touches[0]); }
function onZbUp()  { zbDrag = null; window.removeEventListener('mousemove', onZbMove); window.removeEventListener('mouseup', onZbUp); }
function onZbUpT() { zbDrag = null; window.removeEventListener('touchmove', onZbMoveT); window.removeEventListener('touchend', onZbUpT); }

// Left handle drag — moves left edge, changes zoom
let zhLDrag = null;
function startZhLDrag(clientX) {
  const tr = zoomTrack.getBoundingClientRect();
  const th = zoomThumb.getBoundingClientRect();
  zhLDrag = { startX: clientX, startL: th.left - tr.left, startR: th.right - tr.left };
}
zoomHandleL.addEventListener('mousedown', e => { e.stopPropagation(); startZhLDrag(e.clientX); window.addEventListener('mousemove', onZhLMove); window.addEventListener('mouseup', onZhLUp); });
zoomHandleL.addEventListener('touchstart', e => { e.stopPropagation(); e.preventDefault(); startZhLDrag(e.touches[0].clientX); window.addEventListener('touchmove', onZhLMoveT, { passive: false }); window.addEventListener('touchend', onZhLUpT); }, { passive: false });
function onZhLMove(e) {
  if (!zhLDrag) return;
  const trackW = zoomTrack.offsetWidth;
  const dx  = e.clientX - zhLDrag.startX;
  const newL = Math.max(0, Math.min(zhLDrag.startR - trackW * MIN_THUMB_FRAC, zhLDrag.startL + dx));
  const newW = zhLDrag.startR - newL;
  applyFromThumb(newL, newW);
}
function onZhLMoveT(e) { e.preventDefault(); onZhLMove(e.touches[0]); }
function onZhLUp()  { zhLDrag = null; window.removeEventListener('mousemove', onZhLMove); window.removeEventListener('mouseup', onZhLUp); }
function onZhLUpT() { zhLDrag = null; window.removeEventListener('touchmove', onZhLMoveT); window.removeEventListener('touchend', onZhLUpT); }

// Right handle drag — moves right edge, changes zoom
let zhRDrag = null;
function startZhRDrag(clientX) {
  const tr = zoomTrack.getBoundingClientRect();
  const th = zoomThumb.getBoundingClientRect();
  zhRDrag = { startX: clientX, startL: th.left - tr.left, startW: th.width };
}
zoomHandleR.addEventListener('mousedown', e => { e.stopPropagation(); startZhRDrag(e.clientX); window.addEventListener('mousemove', onZhRMove); window.addEventListener('mouseup', onZhRUp); });
zoomHandleR.addEventListener('touchstart', e => { e.stopPropagation(); e.preventDefault(); startZhRDrag(e.touches[0].clientX); window.addEventListener('touchmove', onZhRMoveT, { passive: false }); window.addEventListener('touchend', onZhRUpT); }, { passive: false });
function onZhRMove(e) {
  if (!zhRDrag) return;
  const trackW = zoomTrack.offsetWidth;
  const dx  = e.clientX - zhRDrag.startX;
  const newW = Math.max(trackW * MIN_THUMB_FRAC, Math.min(trackW - zhRDrag.startL, zhRDrag.startW + dx));
  applyFromThumb(zhRDrag.startL, newW);
}
function onZhRMoveT(e) { e.preventDefault(); onZhRMove(e.touches[0]); }
function onZhRUp()  { zhRDrag = null; window.removeEventListener('mousemove', onZhRMove); window.removeEventListener('mouseup', onZhRUp); }
function onZhRUpT() { zhRDrag = null; window.removeEventListener('touchmove', onZhRMoveT); window.removeEventListener('touchend', onZhRUpT); }


function startInertia() {
  if (inertiaFrame) cancelAnimationFrame(inertiaFrame);
  function step() {
    velX *= FRICTION;
    velY *= FRICTION;
    if (Math.abs(velX) < 0.2 && Math.abs(velY) < 0.2) { velX = 0; velY = 0; return; }
    panX += velX;
    panY += velY;
    clampPan();
    applyTransform();
    inertiaFrame = requestAnimationFrame(step);
  }
  inertiaFrame = requestAnimationFrame(step);
}

// Single-finger pan
let panTouch = null;

let panMoved = false;

viewport.addEventListener('touchstart', e => {
  e.preventDefault();
  if (zoomAnimFrame) return;
  panMoved = false;
  if (inertiaFrame) { cancelAnimationFrame(inertiaFrame); velX = 0; velY = 0; }
  if (e.touches.length === 1) {
    panTouch = { id: e.touches[0].identifier, x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, { passive: false });

viewport.addEventListener('touchmove', e => {
  e.preventDefault();
  if (zoomAnimFrame || measureZoomed) return;
  if (e.touches.length === 1 && panTouch) {
    const t = e.touches[0];
    const dx = t.clientX - panTouch.x;
    const dy = t.clientY - panTouch.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) panMoved = true;
    velX = dx; velY = dy;
    panX += dx; panY += dy;
    panTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
    clampPan();
    applyTransform();
  }
}, { passive: false });

viewport.addEventListener('touchend', e => {
  if (e.touches.length === 0) { panTouch = null; startInertia(); }
}, { passive: true });

// Mouse wheel scrolls horizontally (desktop)
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  panX -= e.deltaX || e.deltaY;
  clampPan();
  applyTransform();
}, { passive: false });

// Mouse drag pan (desktop)
let mouseDrag = null;
viewport.addEventListener('mousedown', e => {
  if (zoomAnimFrame || measureZoomed) return;
  if (inertiaFrame) { cancelAnimationFrame(inertiaFrame); velX = 0; velY = 0; }
  mouseDrag = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mousemove', e => {
  if (!mouseDrag) return;
  const dx = e.clientX - mouseDrag.x;
  const dy = e.clientY - mouseDrag.y;
  velX = dx; velY = dy;
  panX += dx; panY += dy;
  mouseDrag = { x: e.clientX, y: e.clientY };
  clampPan();
  applyTransform();
});
window.addEventListener('mouseup', () => { if (mouseDrag) { mouseDrag = null; startInertia(); } });

applyZoom();
window.addEventListener('resize', updateZoomBar);

// ── Instruments ──
const INSTRUMENTS = [
  { id: 'piano',       name: 'Piano',       icon: '🎹' },
  { id: 'bass',        name: 'Bass',        icon: '🎸' },
  { id: 'lead',        name: 'Lead Synth',  icon: '🎛️' },
  { id: 'pad',         name: 'Pad',         icon: '🌊' },
  { id: 'organ',       name: 'Organ',       icon: '⛪' },
  { id: 'vibraphone',  name: 'Vibraphone',  icon: '🔔' },
  { id: 'plucked',     name: 'Plucked',     icon: '🪕' },
  { id: 'flute',       name: 'Flute',       icon: '🎵' },
  { id: 'brass',       name: 'Brass',       icon: '🎺' },
  { id: 'harpsichord', name: 'Harpsichord', icon: '🎼' },
  { id: 'drums',       name: 'Drum Kit',    icon: '🥁' },
];
let selectedInstrument = INSTRUMENTS[0];

let editingTrackIndex = -1;

function quickAddTrack() {
  if (!canEdit()) return;
  trackCount++;
  addTrack('Track ' + trackCount, selectedInstrument);
}

function openNewTrackModal() {
  editingTrackIndex = -1;
  trackCount++;
  document.getElementById('new-track-name').value = 'Track ' + trackCount;
  selectedInstrument = INSTRUMENTS[0];
  document.getElementById('selected-instrument-icon').textContent = selectedInstrument.icon;
  document.getElementById('selected-instrument-name').textContent = selectedInstrument.name;
  document.getElementById('confirm-track-btn').textContent = 'Add Track';
  document.getElementById('new-track-overlay').style.display = 'flex';
  setTimeout(() => { const f = document.getElementById('new-track-name'); f.focus(); f.select(); }, 50);
}

function openEditTrackModal(index) {
  if (!G || !G.tracks[index]) return;
  editingTrackIndex = index;
  const track = G.tracks[index];
  document.getElementById('new-track-name').value = track.name;
  selectedInstrument = INSTRUMENTS.find(i => i.id === track.instrument) || INSTRUMENTS[0];
  document.getElementById('selected-instrument-icon').textContent = selectedInstrument.icon;
  document.getElementById('selected-instrument-name').textContent = selectedInstrument.name;
  document.getElementById('confirm-track-btn').textContent = 'Update Track';
  document.getElementById('new-track-overlay').style.display = 'flex';
  setTimeout(() => { const f = document.getElementById('new-track-name'); f.focus(); f.select(); }, 50);
}

function closeNewTrackModal() {
  if (editingTrackIndex === -1) trackCount--;
  document.getElementById('new-track-overlay').style.display = 'none';
}

function confirmNewTrack() {
  if (!canEdit()) return;
  const name = document.getElementById('new-track-name').value.trim() || ('Track ' + trackCount);
  if (editingTrackIndex >= 0) {
    // Update existing track
    if (G) {
      pushUndo();
      G.tracks[editingTrackIndex].name = name;
      G.tracks[editingTrackIndex].instrument = selectedInstrument.id;
    }
    const headers = document.getElementById('track-header-list').querySelectorAll('.track-header');
    const header = headers[editingTrackIndex];
    if (header) {
      header.querySelector('.track-icon').textContent = selectedInstrument.icon;
      renderTrackName(header.querySelector('.track-header-name'), name);
    }
  } else {
    addTrack(name, selectedInstrument);
  }
  document.getElementById('new-track-overlay').style.display = 'none';
}

function openInstrumentPicker() {
  const list = document.getElementById('instrument-list');
  list.innerHTML = '';
  INSTRUMENTS.forEach(inst => {
    const btn = document.createElement('button');
    btn.className = 'instrument-option' + (inst.id === selectedInstrument.id ? ' selected' : '');
    btn.innerHTML = `
      <span class="instrument-option-icon">${inst.icon}</span>
      <span class="instrument-option-name">${inst.name}</span>
    `;
    btn.onclick = () => {

      closeInstrumentPicker();

  document.getElementById('instrument-picker-overlay').style.display = 'flex';

function applySolo() {
  const headers = Array.from(document.getElementById('track-header-list').querySelectorAll('.track-header'));
  const rows    = Array.from(document.getElementById('track-list').querySelectorAll('.track-row'));
  const anySoloed = headers.some(h => h.querySelector('.solo-btn')?.classList.contains('active'));
  headers.forEach((h, i) => {
    const soloed = h.querySelector('.solo-btn')?.classList.contains('active');
    const dimmed = anySoloed && !soloed;
    h.classList.toggle('soloed-out', dimmed);
    if (rows[i]) rows[i].classList.toggle('soloed-out', dimmed);
  });
}

  const headers = document.getElementById('track-header-list').querySelectorAll('.track-header');

function splitTrackName(name) {
  if (name.length <= 8) return [name, ''];
  // Find word boundary nearest the midpoint
  const mid = Math.floor(name.length / 2);
  const spaces = [...name.matchAll(/ /g)].map(m => m.index);
  if (spaces.length === 0) {
    // No spaces — hard split at midpoint
    return [name.slice(0, mid), name.slice(mid)];
  }
  const best = spaces.reduce((a, b) => Math.abs(a - mid) <= Math.abs(b - mid) ? a : b);
  return [name.slice(0, best), name.slice(best + 1)];
}

function renderTrackName(el, name) {
  const [line1, line2] = splitTrackName(name);
  el.innerHTML = `<div class="track-header-name-line">${line1}</div><div class="track-header-name-line">${line2}</div>`;
}

function buildMeasureCells(row) {
  const selected = new Set();
  row.querySelectorAll('.measure-cell.selected').forEach(c => selected.add(+c.dataset.measure));
  row.querySelectorAll('.measure-cell').forEach(c => c.remove());
  const mw = MEASURE_W * scaleX;
  for (let m = 0; m < TOTAL_MEASURES; m++) {
    const cell = document.createElement('div');
    cell.className = 'measure-cell' + (selected.has(m) ? ' selected' : '');
    cell.dataset.measure = m;
    cell.style.left  = (m * mw) + 'px';
    cell.style.width = (mw - 2) + 'px';
    cell.innerHTML = `<span style="position:absolute;top:3px;left:5px;font-family:var(--mono);font-size:0.5rem;color:rgba(255,255,255,0.2);pointer-events:none;user-select:none;">${m + 1}</span>`;
    cell.addEventListener('touchend', e => {
      if (panMoved) return;
      e.stopPropagation();
      e.preventDefault();
      handleMeasureTap(cell, +row.dataset.trackIndex, m);
    }, { passive: false });
    cell.addEventListener('click', () => handleMeasureTap(cell, +row.dataset.trackIndex, m));
    row.appendChild(cell);
  }
}

function updateTrackGrids() {
  const sig   = G ? G.timeSig : setup.timeSig;
  const beats = parseInt(sig.split('/')[0]) || 4;
  const mw    = MEASURE_W * scaleX;
  const beatW = mw / beats;
  const measureColor = 'rgba(255,255,255,0.12)';
  const beatColor    = 'rgba(255,255,255,0.04)';
  const bg = `
    repeating-linear-gradient(90deg,
      transparent 0px,
      transparent ${mw - 2}px,
      ${measureColor} ${mw - 2}px,
      ${measureColor} ${mw}px
    ),
    repeating-linear-gradient(90deg,
      transparent 0px,
      transparent ${beatW - 1}px,
      ${beatColor} ${beatW - 1}px,
      ${beatColor} ${beatW}px
    )
  `;
  document.querySelectorAll('.track-row').forEach(r => {
    r.style.backgroundImage = bg;
    r.style.width = (TOTAL_MEASURES * mw) + 'px';
    buildMeasureCells(r);
  });
}
